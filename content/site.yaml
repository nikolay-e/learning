hero:
  eyebrow: Справочник · {count} {principles} · 4 языка
  paragraphs:
    - Примеры на современной Java, Rust, Go и Python (3.12+). Принципы сгруппированы по осям; для
      код-уровневых даны примеры на всех четырёх языках, для архитектурных — представительный пример.
      Версия рантайма указана на карточке там, где API от неё зависит.
    - 'У каждого принципа проставлен <strong>тип утверждения</strong> — теорема, эмпирический закон,
      эвристика, паттерн, практика или редакционная позиция — и уровень уверенности. Это главное,
      что отличает справочник от списка «лучших практик»: закон Амдала и «выбирай скучные технологии»
      не одного сорта, и страница не делает вид, что одного.'
    - '<a href="#s10">Раздел XIII</a> перечисляет пары принципов, которые противоречат друг другу,
      и способ разрешения. Номера принципов — стабильные идентификаторы: новые дописываются в конец
      нумерации и встают в тематический раздел, поэтому внутри раздела последовательность не сплошная.'
    - 'Скоуп — технические и инженерно-экономические принципы, включая организационные практики, которые
      непосредственно определяют архитектуру, delivery model, операционный риск или интерфейс внутренней
      платформы (<a href="#p15">15</a>, <a href="#p76">76</a>, <a href="#p84">84</a>, <a href="#p85">85</a>).
      Вне скоупа — практики, не оставляющие следа в системе: постмортемы, найм, перформанс-ревью.'
    - 'Все примеры — <strong>фрагменты</strong>: реальный синтаксис, но не самостоятельные программы,
      они опираются на типы и импорты за кадром. Статус помечен на каждой карточке; CI проверяет то,
      что проверяемо статически.'
  chips:
    - Java
    - Rust
    - Go
    - Python 3.12+
    - / — фильтр
kinds:
  theorem:
    label: теорема
    hint: Доказуемое утверждение с формальными предпосылками
  empirical-law:
    label: эмпирический закон
    hint: Наблюдение, устойчиво воспроизводимое, но не доказанное
  heuristic:
    label: эвристика
    hint: Правило принятия решений с областью применимости
  pattern:
    label: паттерн
    hint: Повторяемое решение известной задачи
  practice:
    label: практика
    hint: Операционная процедура или инженерная дисциплина
  editorial:
    label: позиция автора
    hint: Редакционная точка зрения этой страницы, не консенсус
confidences:
  established:
    label: устоявшееся
    hint: Широкий консенсус в индустрии или литературе
  context-dependent:
    label: зависит от контекста
    hint: Верно в очерченных условиях, вне их — нет
  opinionated:
    label: спорное
    hint: Формулировка сильнее, чем доказательная база
example_statuses:
  fragment:
    label: фрагмент
    hint: Реальный синтаксис, но не самостоятельная программа
  config:
    label: конфигурация
    hint: Декларативный конфиг, а не исполняемый код
  pseudocode:
    label: псевдокод
    hint: Иллюстрация формы; синтаксис не гарантирован
  none:
    label: без кода
    hint: Принцип не выражается кодом
