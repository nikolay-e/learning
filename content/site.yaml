title: 'Принципы программной инженерии: от SOLID до AI-эры'
description: Справочник принципов программной инженерии с примерами на Java, Rust, Go и Python 3.12+
  — от SOLID и parse-don't-validate до распределённых данных, стриминга и систем с LLM внутри.
og_description: '{count} {principles}, сгруппированных по осям, с примерами на четырёх языках, классификацией
  типа утверждения и таблицей конфликтов между ними.'
