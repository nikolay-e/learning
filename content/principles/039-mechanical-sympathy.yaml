id: 39
slug: mechanical-sympathy
title: Mechanical sympathy
nav_label: Mechanical sympathy
section: s7
keywords: mechanical sympathy false sharing cache line numa syscall padding
blocks:
  - type: lede
    html:
      Cache line 64B, false sharing, NUMA, стоимость syscall. Смежно с DOD, но шире — включает знание
      рантайма.
  - type: text
    html: 'Ключ ко всему списку один: процессор работает не с байтами, а со строками кэша по 64 байта.
      False sharing — два потока пишут в разные переменные, случайно попавшие в одну строку: логически
      конкуренции нет, физически строка мечется между ядрами, и код тормозит без единого лока
      (лечится паддингом до размера строки). NUMA — на многосокетной машине у памяти есть «свой»
      и «чужой» сокет, обращение к чужому дороже, поэтому важно, где поток запущен относительно своих
      данных. Syscall дорог не переключением как таковым, а тем, что после него кэши и предсказатель
      переходов работают уже не на вас, — отсюда батчинг вместо поштучных вызовов. Общее у всех
      четырёх: стоимость невидима в исходнике и проявляется только измерением
      (<a href="#p37">37</a>).'
  - type: code
    panes:
      - lang: java
        tab: Java
        label: Java
        highlight: java
        code:
          "// false sharing: два счётчика в одной cache line убивают многопоточный инкремент

          @jdk.internal.vm.annotation.Contended  // или padding вручную

          volatile long producerIdx;"
      - lang: rust
        tab: Rust
        label: Rust
        highlight: rust
        code:
          "#[repr(align(64))]                       // счётчик на собственной cache line

          struct PaddedCounter(AtomicU64);"
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code: "// Идиома: per-P шардированные счётчики + padding

          type shard struct { n atomic.Uint64; _ [56]byte } // добивка до 64B"
      - lang: python
        tab: Python
        label: Python
        highlight: python
        code: |-
          # В CPython доминирует не строка кэша, а сам интерпретаторный цикл,
          # поэтому механическая симпатия здесь — унести цикл из Python в C
          total = sum(row.price for row in rows)        # ~10**6 шагов интерпретатора

          prices = np.frombuffer(buf, dtype=np.int64)   # тот же расчёт одним вызовом:
          total = int(prices.sum())                     # цикл и векторизация внутри C

          # без зависимостей то же делает memoryview:
          # срез bytes копирует, срез memoryview — нет
          window = memoryview(buf)[offset:offset + size]
