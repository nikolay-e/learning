id: 47
slug: kod-chitaetsya-na-poryadok-chasche-chem-pishetsy
title: Код оптимизируется под чтение, а не под скорость написания
nav_label: Оптимизация под чтение
section: s8
keywords: readability explicit over implicit zen of python magic reflection код читается чаще чем
  пишется
blocks:
  - type: lede
    html:
      "Обоснование явности над магией: в Java — меньше рефлексии и аннотационной магии; в Rust — меньше
      макро-DSL; в Go — это философия языка целиком; в Python — «explicit is better than implicit» из <code>import
      this</code>."
  - type: text
    html: 'Расхожая формулировка — «код читается на порядок чаще, чем пишется». «На порядок» здесь
      риторика, а не измерение, и держать надо не её. Проверяемая часть: после первого набора текст
      проходит через ревью, диагностику инцидента, правку соседней команды и чтение того, кто ищет,
      где именно ломается, — и стоимость каждого из этих проходов зависит от того, сколько поведения
      выражено явно. Магия экономит время ровно один раз — в момент написания, тем, кто уже держит
      всю картину в голове.'
