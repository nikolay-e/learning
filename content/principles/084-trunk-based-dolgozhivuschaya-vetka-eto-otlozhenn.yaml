id: 84
slug: trunk-based-dolgozhivuschaya-vetka-eto-otlozhenn
title: "Trunk-based: долгоживущая ветка — это отложенная интеграция с процентами"
nav_label: Trunk-based
section: s13
keywords:
  trunk based development long lived branch merge queue gitflow continuous integration feature
  flags ci speed
blocks:
  - type: lede
    html:
      'Merge-конфликт не создаётся слиянием — он создаётся расхождением и лишь <em>обнаруживается</em>
      слиянием; сотни долгоживущих веток = организация, месяцами копящая необнаруженные конфликты. Trunk-based
      переворачивает: интеграция непрерывна, незавершённая работа прячется за флагами (<a href="#p72">72</a>),
      а не за ветками. Ветка живёт дни, не спринты.'
  - type: note
    html:
      'Механика, без которой trunk-based на 80+ сервисах разваливается: merge queue (батчи PR тестируются
      <em>в порядке будущего merge</em>, не против устаревшего main — иначе «зелёный PR, красный main» ежедневно)
      плюс required checks быстрее 10–15 минут: медленный CI воссоздаёт долгоживущие ветки экономически,
      потому что людям дорого интегрироваться часто. Флаги вместо веток переносят риск из «конфликт при
      merge» в flag debt (<a href="#p72">72</a>) — осознанный обмен, второе дешевле, потому что видимо.'
  - type: note
    html:
      Кодом не выражается; выражается политикой репозитория и, главное, скоростью CI — trunk-based это
      в первую очередь SLO на билд.
