id: 19
slug: postel-s-law-otmenena
title: Postel's Law — отменена
nav_label: Postel's Law — отменена
section: s3
keywords: postel law robustness principle rfc 9413 be liberal ossification
blocks:
  - type: lede
    html:
      "«Будь либерален к входу» породила XSS, request smuggling и невозможность эволюции протоколов.
      Современная позиция: строгая валидация на границе, отказ вместо угадывания."
  - type: note
    html:
      "<strong>Честно про заголовок.</strong> RFC 9413 называется «Maintaining Robust Protocols» и формально
      ничего не отменяет: он показывает, что либеральный приём сам по себе становится источником окостенения
      (ossification) и уязвимостей, и рекомендует активное управление допусками, а не их запрет. «Отменена»
      — редакционная позиция этой страницы, а не текст RFC."
  - type: code
    panes:
