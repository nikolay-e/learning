id: 43
slug: dry-pro-znanie-ne-pro-tekst
title: DRY — про знание, не про текст
nav_label: DRY — про знание
section: s8
keywords: dry dont repeat yourself knowledge duplication shared code package common utils свалка
  хелперы
blocks:
  - type: lede
    html:
      "Одинаковые пять строк в двух bounded contexts — не дублирование: они меняются по разным причинам.
      Их «устранение» связывает то, что обязано меняться независимо."
  - type: text
    html: 'Обе крайности стоят денег. Скопированное <em>знание</em> — одно правило, физически лежащее
      в трёх местах, — расходится молча: правку внесли в две копии из трёх, третья продолжает считать
      по-старому, и никто об этом не узнает до инцидента. Устранённое <em>совпадение</em> — сведённый
      в общий хелпер код двух контекстов, одинаковый только на сегодня, — связывает то, что обязано
      расходиться: первая же различающаяся правка приезжает флагом в сигнатуре. Вопрос всегда один
      и тот же: это одно знание или два, которые сейчас выглядят одинаково. Признак второго —
      <code>package common</code> / <code>utils</code>, растущий бесконечно: у свалки нет владельца
      и нет собственной причины меняться, потому что причин у неё столько же, сколько потребителей.'
  - type: note
    html: '<strong>Bounded context</strong> (<a href="#p14">14</a>) — граница, внутри которой слова
      значат одно и то же: «Customer» биллинга и «Customer» маркетинга — разные типы, даже когда поля
      совпадают. DRY действует внутри такой границы. Через границу одинаковый текст — совпадение,
      а не дублирование, и выносить его в общий модуль значит склеить два контекста через код, который
      никому из них не принадлежит.'
  - type: code
    panes:
      - lang: null
        tab: null
        label: Go
        highlight: go
        code:
          "// НЕ надо: pkg/common/validation.go, куда billing и crm ходят за validateEmail


          // НАДО: у каждого контекста своя копия — биллингу вскоре понадобится

          // RFC-строгость для инвойсов, CRM — терпимость к маркетинговым мусорным адресам.

          // Общая функция заставила бы один из контекстов врать."
