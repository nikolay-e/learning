id: 70
slug: kesh-eto-replika-s-zadokumentirovannym-byudzheto
title: Кэш — это реплика с задокументированным бюджетом staleness
nav_label: Кэш и staleness budget
section: s11
keywords: cache ttl staleness budget invalidation write-through write-behind cache-aside кэш инвалидация
blocks:
  - type: lede
    html:
      "Кэш — не «ускорение», а осознанное ослабление консистентности: TTL — это SLA на устаревание,
      и он должен быть выведен из бизнес-требования («цена может врать 60 секунд»), а не из «ну пусть 5
      минут». Инвалидация по событию и TTL как страховочный пол — хороший дефолт именно вместе: инвалидация
      теряется не от семантики доставки, а от операционных отказов — упавшего релея, переполнения,
      ошибки маршрутизации, рассинхрона после rebalance, — и TTL ограничивает ущерб такой потери. Это
      дефолт, а не обязанность: durable write-through с явно заданными гарантиями тоже корректен."
  - type: code
    panes:
      - lang: null
        tab: null
        label: Go
        highlight: go
        code:
          "// TTL как контракт, а не константа в глубине кода\ntype CachePolicy struct {\n    TTL    \
          \              time.Duration // = задокументированный staleness budget\n    StaleWhileRevalidate\
          \ time.Duration // отдаём протухшее, обновляем фоном\n}\n\nvar pricePolicy = CachePolicy{TTL: 60\
          \ * time.Second, StaleWhileRevalidate: 10 * time.Second}\n// ревью-вопрос: \"откуда 60?\" должен\
          \ иметь ответ со ссылкой на требование"
  - type: note
    html:
      "Cache-aside / read-through / write-through / write-behind — не вкусовщина: write-behind теряет
      данные при падении кэша и допустим только для восстановимого (счётчики, метрики). Ключ с двумя писателями
      (сервис и инвалидатор) — гонка по построению; версионируйте значение или пишите через одну точку."
