title: Supply chain (SLSA, SBOM, pinned deps)
nav_label: Supply chain
section: s6
keywords: supply chain slsa sbom pinned dependencies lockfile cargo-deny govulncheck syft
blocks:
  - type: lede
    html: Главный практический вектор атак последних лет — не ваш код.
  - type: text
    html: 'Два сокращения из заголовка отвечают на разные вопросы. SBOM — опись того, из чего собран
      артефакт: пакеты, версии, хеши. Она нужна не для отчётности, а чтобы на вопрос «затрагивает ли
      нас эта CVE» отвечать за минуты машинным запросом, а не за неделю опроса команд. SLSA — уровневая
      шкала требований не к коду, а к самой сборке: что она идёт из версионированного источника,
      на изолированном раннере, с подписанным provenance «этот бинарник собран из этого коммита этим
      пайплайном». Короче: SBOM говорит, что внутри, SLSA — можно ли верить тому, кто это собрал.
      Пиннинг — предусловие для обоих: без него опись описывает не то, что уедет в прод завтра
      (<a href="#p83">83</a>).'
  - type: code
    panes:
      - lang: rust
        tab: Rust
        label: Rust · cargo-deny
        highlight: toml
        code: '# Cargo.lock коммитится + cargo-deny в CI

          [bans]

          deny = [{ name = "openssl" }]        # политика: только rustls


          [advisories]

          vulnerability = "deny"'
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code:
          "// go.sum — криптографические хэши всех зависимостей; публичные модули

          // дополнительно сверяются с checksum database (sum.golang.org).

          //

          // GOPRIVATE=git.example.com/*  — приватные префиксы мимо proxy и checksum DB

          // GONOSUMDB / GONOSUMCHECK     — более узкие настройки и НЕ усиление:

          //                                они ОТКЛЮЧАЮТ сверку, а не включают её

          //

          // govulncheck в CI — вызовной анализ: алертит только на реально достижимые уязвимости"
      - lang: python
        tab: Python
        label: Python · uv
        highlight: bash
        code: |-
          # lock коммитится; плавающие версии запрещены, SBOM — на каждый релиз
          uv lock --check      # CI падает, если lock разошёлся с pyproject.toml
          uv sync --frozen     # ставим ровно то, что в lock, без пересчёта
          syft dir:. -o spdx-json > sbom.json
      - lang: java
        tab: Java
        label: Java · Gradle
        highlight: bash
        code: |-
          # verification-metadata.xml фиксирует хеши всех артефактов сборки
          ./gradlew --write-verification-metadata sha256 help   # сгенерировать
          ./gradlew build      # падает, если хеш зависимости не совпал
          # Maven — тот же смысл через dependency-lock и checksum-политику репозитория
