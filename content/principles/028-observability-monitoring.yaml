id: 28
slug: observability-monitoring
title: Observability ≠ мониторинг
nav_label: Observability ≠ мониторинг
section: s5
keywords: observability wide structured events high cardinality unknown unknowns
blocks:
  - type: lede
    html:
      'Мониторинг проверяет заранее сформулированные условия; observability — способность разобраться
      в состоянии, которое никто не предвидел, не выкатывая ради этого новый код. Wide structured
      events с высокой кардинальностью — сильный механизм такой способности, а не её определение:
      метрики, трейсы и профили отвечают на другие вопросы и не заменяются событиями.'
  - type: code
    panes:
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code:
          "// Один широкий event на запрос вместо десятка разрозненных лог-строк\nlogger.Info(\"request_completed\"\
          ,\n    \"trace_id\", traceID, \"customer_id\", custID, \"endpoint\", \"/charge\",\n    \"duration_ms\"\
          , ms, \"retry_count\", retries, \"gateway\", gw, \"outcome\", outcome,\n    \"amount_cents\", amt,\
          \ \"deploy_sha\", buildSHA)\n\n// потом: \"покажи p99 по gateway для клиентов из EU на версии abc123\"\
          \ — отвечается"
      - lang: python
        tab: Python
        label: Python · structlog
        highlight: python
        code: '# контекст накапливается по пути запроса

          log = structlog.get_logger().bind(trace_id=tid, customer_id=cid)

          ...

          log.info("request_completed", duration_ms=ms, outcome="declined", reason=r)'
