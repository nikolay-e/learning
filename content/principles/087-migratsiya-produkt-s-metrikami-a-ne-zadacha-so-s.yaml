id: 87
slug: migratsiya-produkt-s-metrikami-a-ne-zadacha-so-s
title: Миграция — продукт с метриками, а не задача со сроком
nav_label: Миграция как продукт
section: s3
keywords: migration dual run shadow compare cutover diff rate sunk cost миграция владелец отмена
blocks:
  - type: lede
    html:
      "Zero-downtime миграция (ID-схема, формат хранения, gitflow → trunk, платформа) — не «переключение»,
      а конвейер: dual-run (обе системы работают) → shadow/compare (новая получает копию трафика, расхождения
      меряются) → постепенный cutover с обратимым роутингом → период соседства → contract (снос старого).
      Метрика прогресса публична (% трафика / сервисов / записей на новом пути), и — самое игнорируемое
      — у миграции есть <em>владелец до конца</em>: миграция, законченная на 90%, хуже неначатой, потому
      что теперь систем две навсегда."
  - type: code
    panes:
      - lang: null
        tab: null
        label: Go · shadow-compare
        highlight: go
        code: |-
          // АНТИПАТТЕРН: горутина на каждый запрос — неограниченная конкурентность,
          // контекст отменён сразу после ответа клиенту, ни таймаута, ни recover
          go func() {
              nu, nerr := m.next.Get(ctx, id)          // ctx уже отменён
              m.compare.Record(id, old, err, nu, nerr) // паника здесь снимает процесс
          }()

          // НОРМА: новая реализация получает трафик, но не право голоса —
          // через ограниченную очередь, со своим контекстом и таймаутом
          func (m *Migrator) Get(ctx context.Context, id UserID) (User, error) {
              old, err := m.legacy.Get(ctx, id)
              m.shadow.Offer(job{id, old, err}) // неблокирующе: очередь полна —
              return old, err                   // сэмпл выбрасывается, клиент не ждёт
          }   // источник правды пока старый; cutover — когда diff-rate < порога
              // N дней подряд, и это число записано ДО начала

          func (m *Migrator) shadowWorker() {
              for j := range m.shadow.Jobs() {
                  func() {
                      defer func() { _ = recover() }() // паника воркера не роняет процесс
                      ctx, cancel := context.WithTimeout(m.shadowBase, 200*time.Millisecond)
                      defer cancel()
                      nu, nerr := m.next.Get(ctx, j.id)
                      m.compare.Record(j.id, redact(j.old), j.err, redact(nu), nerr)
                  }()
              }
          }
  - type: note
    html:
      "<strong>Честная оценка.</strong> Организационные миграции (gitflow → trunk, monorepo, платформа)
      подчиняются той же механике, что и технические: dual-run = обе модели разрешены, cutover = новые сервисы
      только на новой, contract = старая выключена <em>датой</em>, объявленной заранее. «Добровольно и бессрочно»
      — это не миграция, а вечное удвоение поддержки. Критерий отмены тоже пишется до старта: миграция без
      условия «когда мы откатываемся» — ловушка sunk cost в производственном масштабе."
  - type: note
    html:
      "Чего не видно в коде: <code>shadowBase</code> — не производный от запроса контекст, а собственный,
      несущий только разрешённые correlation-атрибуты и ни одного пользовательского; на теневой путь
      нужен circuit breaker, иначе деградация новой системы начинает съедать ресурсы старой; а очередь
      обязана иметь метрику отброшенных сэмплов — молча теряемый теневой трафик превращает diff-rate
      в цифру, измеряющую саму себя."
