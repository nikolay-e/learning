id: 87
slug: migratsiya-produkt-s-metrikami-a-ne-zadacha-so-s
title: Миграция — продукт с метриками, а не задача со сроком
nav_label: Миграция как продукт
section: s3
keywords: migration dual run shadow compare cutover diff rate sunk cost миграция владелец отмена
blocks:
  - type: lede
    html:
      "Zero-downtime миграция (ID-схема, формат хранения, gitflow → trunk, платформа) — не «переключение»,
      а конвейер: dual-run (обе системы работают) → shadow/compare (новая получает копию трафика, расхождения
      меряются) → постепенный cutover с обратимым роутингом → период соседства → contract (снос старого).
      Метрика прогресса публична (% трафика / сервисов / записей на новом пути), и — самое игнорируемое
      — у миграции есть <em>владелец до конца</em>: миграция, законченная на 90%, хуже неначатой, потому
      что теперь систем две навсегда."
  - type: code
    panes:
      - lang: null
        tab: null
        label: Go · shadow-compare
        highlight: go
        code:
          "// новая реализация получает трафик, но не право голоса\nfunc (m *Migrator) Get(ctx context.Context,\
          \ id UserID) (User, error) {\n    old, err := m.legacy.Get(ctx, id)\n    go func() { // теневой\
          \ вызов вне критического пути\n        nu, nerr := m.next.Get(shadowCtx(ctx), id)\n        m.compare.Record(id,\
          \ old, err, nu, nerr) // расхождения → метрика, не паника\n    }()\n    return old, err // источник\
          \ правды пока старый; cutover — когда diff-rate < порога\n                    // N дней подряд,\
          \ и это число записано ДО начала\n}"
  - type: note
    html:
      "<strong>Честная оценка.</strong> Организационные миграции (gitflow → trunk, monorepo, платформа)
      подчиняются той же механике, что и технические: dual-run = обе модели разрешены, cutover = новые сервисы
      только на новой, contract = старая выключена <em>датой</em>, объявленной заранее. «Добровольно и бессрочно»
      — это не миграция, а вечное удвоение поддержки. Критерий отмены тоже пишется до старта: миграция без
      условия «когда мы откатываемся» — ловушка sunk cost в производственном масштабе."
  - type: note
    html:
      "<strong>Опасность теневого вызова.</strong> Горутина на каждый запрос — это неограниченная конкурентность,
      отмена контекста сразу после ответа клиенту, отсутствие таймаута и незакрытая паника. Рабочая форма:
      пул с ограниченной очередью и сэмплированием, отдельный короткоживущий контекст (только разрешённые
      correlation-атрибуты, без пользовательских данных), таймаут и circuit breaker на теневой путь, recover
      в воркере и редакция PII перед записью расхождений."
