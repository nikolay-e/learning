blocks:
  - type: lede
    html:
      'Сложную систему безопаснее выращивать через работающие промежуточные состояния, чем вводить
      одним big-bang: на эволюционном пути каждый шаг даёт работающую систему, которую можно измерить
      и откатить, а у большого взрыва первая встреча с реальностью совпадает с датой запуска.'
  - type: note
    html: "Практика: walking skeleton → инкременты, никогда big-bang."
