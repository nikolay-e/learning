title: Lehman's Laws / технический долг как термодинамика
nav_label: Lehman's Laws
section: s8
keywords: lehman laws technical debt entropy software evolution e-type энтропия метафора
blocks:
  - type: lede
    html:
      Используемая система обязана меняться; её сложность растёт, пока в неё не вкладывают работу специально.
      Бюджет на снижение энтропии — регулярная статья, а не «когда-нибудь потом».
  - type: text
    html: 'Два разных утверждения в одной карточке, и они разного веса. Наблюдения Лемана — эмпирика:
      система, встроенная в изменяющуюся среду (E-type), либо меняется, либо теряет пригодность, и
      её структура деградирует, если работу по её сохранению не финансируют отдельно. «Термодинамика»
      же — метафора, и она врёт в главном: рост сложности не самопроизвольный процесс, а сумма локально
      рациональных решений, каждое из которых по отдельности дешевле правильного. Из физической аналогии
      следовало бы «сопротивляться бесполезно»; из эмпирики следует ровно обратное — это статья бюджета,
      и она управляема.'
