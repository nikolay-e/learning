id: 42
slug: yagni-rule-of-three-aha
title: YAGNI + Rule of Three (AHA)
nav_label: YAGNI + Rule of Three
section: s8
keywords: yagni rule of three aha avoid hasty abstraction duplication you aren't gonna need it
  фабрика преждевременная абстракция
blocks:
  - type: lede
    html:
      "Абстракция появляется на третьем повторении. Первое дублирование дешевле неверной абстракции:
      неверная абстракция заставляет все будущие случаи врать о своей природе."
  - type: text
    html: 'YAGNI — You Aren''t Gonna Need It — читается буквально: не пишите код, который сегодня
      никому не нужен. Ни функцию «пусть будет», ни параметр «вдруг понадобится», ни фабрику под единственную
      реализацию. Платят не за строки: этот код с первого дня требует чтения, тестов, правки при каждом
      рефакторинге — и сообщает читателю ось изменения, которой не существует. Практический тест:
      если вы не можете назвать второй случай, уже присутствующий в коде, — второго случая нет. «Наверное,
      понадобится» на практике означает «не понадобится, а если понадобится — форма будет другая».'
  - type: note
    html: '<strong>Как это выглядит на OCP.</strong> Интерфейс плюс фабрика вместо <code>if</code>
      по типу — каноническое «расширение новым кодом, не правкой старого» (<a href="#p1">1</a>): новый
      вариант добавляется реализацией, старый код не трогают. Ровно эта конструкция и есть типовое
      нарушение YAGNI, пока реализация одна: три сущности вместо одной ветки ради оси изменения, которую
      никто не доказал. Порядок обратный привычному — сначала второе и третье повторение, потом абстракция;
      OCP применяют к оси, которая уже проявилась, а не к предсказанной.'
