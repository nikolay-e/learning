id: 16
slug: hyrum-s-law
title: Hyrum's Law
nav_label: Hyrum's Law
section: s3
keywords: hyrum law implicit dependencies observable behavior
blocks:
  - type: lede
    html:
      "При достаточном числе потребителей все наблюдаемые свойства API — контракт: порядок ключей JSON,
      латентность, текст сообщений об ошибках."
  - type: code
    panes:
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code: "// proverb-уровень: не давайте наблюдать то, что не обещаете

          // map намеренно рандомизирует порядок итерации — язык защищается от закона Хайрама

          for k := range m { ... } // порядок разный при каждом запуске — зависимость невозможна"
      - lang: java
        tab: Java
        label: Java
        highlight: java
        code:
          "// то же — Set.of()/Map.of() рандомизируют порядок итерации между запусками JVM

          // именно чтобы никто не начал зависеть от него"
  - type: note
    html:
      "<strong>Точность.</strong> Спецификация Go говорит, что порядок итерации по map <em>не определён</em>
      и не гарантирован между итерациями, а не что он «случайный и всегда разный». Практический вывод тот
      же: зависеть от него нельзя — но формулировка «рандомизирует» описывает реализацию, а не контракт
      языка."
