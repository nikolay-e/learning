id: 14
slug: bounded-context-ddd
title: Bounded Context (DDD)
nav_label: Bounded Context
section: s2
keywords: ddd bounded context anti-corruption layer ubiquitous language
blocks:
  - type: lede
    html:
      Одна модель не бывает универсальной. «Customer» биллинга и «Customer» маркетинга — разные типы;
      слияние порождает god-таблицу на 60 nullable-колонок.
  - type: text
    html: 'Откуда берётся проблема. Слово «заказ» в интернет-магазине произносят четыре отдела, и каждый
      имеет в виду своё: склад — позиции и место на полке, бухгалтерия — сумму, налог и статус оплаты,
      доставка — адрес и габариты коробки, поддержка — переписку с клиентом. Пока это один класс
      <code>Order</code>, он обязан носить поля всех четырёх сразу, и у каждого потребителя пустует
      три четверти из них — так и получается таблица на шестьдесят nullable-колонок. Хуже колонок то,
      что склеено: у отделов независимые причины меняться (<a href="#p1">1</a>), а правка формата
      отгрузки теперь проходит через тип, от которого зависит расчёт налога.'
  - type: text
    html: 'Что такое граница. Bounded context — участок системы, внутри которого каждое слово значит
      ровно одно, а на выходе из него смысл приходится переводить. «Customer» биллинга и «Customer»
      маркетинга — не две версии одного понятия, а два разных понятия, случайно названных одним словом:
      гаечный ключ и ключ от квартиры не становятся одним предметом от совпадения названия. Совпадение
      полей ничего не доказывает — <code>id</code>, <code>email</code>, <code>name</code> есть у обоих,
      но меняться они будут по разным поводам и в разные дни. Критерий тот же, что у Парнаса
      (<a href="#p12">12</a>): граница проходит по решению, которое пересматривают отдельно, — и по
      той же причине DRY (<a href="#p43">43</a>) через границу не действует.'
  - type: code
    panes:
      - lang: null
        tab: null
        label: Rust
        highlight: rust
        code: "// Разные крейты — разные типы; трансляция на границе явная


          // crates/billing/src/lib.rs

          pub struct Customer { pub id: CustomerId, pub payment_methods: Vec<PaymentMethod> }


          // crates/crm/src/lib.rs

          pub struct Customer { pub id: CustomerId, pub segments: Vec<Segment> }


          // Anti-corruption layer: From<crm::Customer> нет намеренно — маппинг только через

          // явную функцию с бизнес-решениями, а не механический"
  - type: note
    html: '<strong>Перевод — бизнес-решение, а не перекладывание полей.</strong> Прослойка, которая
      его делает, называется anti-corruption layer: она существует, чтобы понятия чужого контекста не
      протекали внутрь. Отсутствие <code>From&lt;crm::Customer&gt;</code> в примере намеренное —
      автоматическое преобразование делает вид, что типы одинаковы, а первый же вопрос «клиента,
      заблокированного за долг, маркетинг считает активным?» показывает, что это не так. Отвечает на
      такой вопрос не маппер, а тот, кто владеет контекстом.'
  - type: note
    html: '<strong>Три ошибки на входе.</strong> Bounded context — не микросервис: границы смысла
      проводятся в коде, и четыре контекста прекрасно живут в одном процессе и одной кодовой базе;
      разъезд по сервисам — отдельное решение с отдельной ценой (<a href="#p13">13</a>). Одинаковый
      набор полей — не доказательство одного типа, а сегодняшнее совпадение, и ось изменения тут ещё
      не доказана (<a href="#p42">42</a>). Удобный <code>Customer.from(...)</code> — самая дорогая из
      трёх: он не запрещён, он создаёт впечатление, будто перевод механический, и тем самым прячет
      место, где надо было принять решение.'
