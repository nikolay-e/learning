section: s2
keywords: coupling cohesion afferent efferent instability archunit import-linter depguard
blocks:
  - type: lede
    html:
      "Единственная пара метрик дизайна, поддающаяся измерению (afferent/efferent coupling, instability).
      Практика: направленные зависимости проверяются в CI, а не в head-каноне ревьюера."
  - type: text
    html: 'Что именно считается: Ca (afferent) — сколько модулей зависят от вас, Ce (efferent) — от
      скольких зависите вы, instability I = Ce / (Ca + Ce). I = 0 — от вас зависят все, вы ни от кого:
      менять дорого, зато никто не ломает вас. I = 1 — наоборот. Ценность не в самих числах, а в
      направлении: устойчивое не должно зависеть от неустойчивого, иначе изменение в самом изменчивом
      модуле поднимается вверх по графу ко всем его читателям. Cohesion той же линейкой не меряется —
      это вопрос «меняется ли содержимое модуля по одной причине» (<a href="#p1">1</a>), и он
      остаётся суждением.'
  - type: code
    panes:
      - lang: null
        tab: null
        label: Java · ArchUnit
        highlight: java
        code:
          "// правило зависимостей как тест\n@ArchTest\nstatic final ArchRule layering = layeredArchitecture().consideringAllDependencies()\n\
          \    .layer(\"domain\").definedBy(\"..domain..\")\n    .layer(\"infra\").definedBy(\"..infra..\"\
          )\n    .whereLayer(\"domain\").mayNotAccessAnyLayer(); // домен не знает про инфраструктуру"
  - type: note
    html:
      <strong>Go</strong> — depguard / <code>go list -deps</code> в CI. <strong>Rust</strong> — крейты
      в workspace (граф зависимостей = Cargo.toml, циклы невозможны). <strong>Python</strong> — import-linter
      с контрактом слоёв.
