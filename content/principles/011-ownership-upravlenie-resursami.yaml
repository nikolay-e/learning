id: 11
slug: ownership-upravlenie-resursami
title: Ownership / управление ресурсами
nav_label: Ownership и ресурсы
section: s1
keywords: raii ownership borrow lifetime resource leak defer context manager
blocks:
  - type: lede
    html: 'У каждого ресурса ровно один владелец, отвечающий за освобождение, и момент освобождения
      привязан к области видимости, а не к дисциплине программиста. Языки различаются только тем,
      кто за этим следит: Rust проверяет владение компилятором, остальные дают конструкцию
      (try-with-resources, defer, with) и ловят забытое линтером. Сборщик мусора эту роль не
      исполняет: он отвечает за память, а не за дескрипторы, соединения и блокировки, и момент
      финализации не определён.'
  - type: code
    panes:
      - lang: rust
        tab: Rust
        label: Rust
        highlight: rust
        code:
          "// эталон — владение в типе, компилятор доказывает отсутствие use-after-free

          fn process(conn: Connection) -> Report { ... }

          // забрал владение: вызвавший больше не может использовать conn"
      - lang: java
        tab: Java
        label: Java
        highlight: java
        code:
          "// try-with-resources + AutoCloseable; Cleaner для нативных ресурсов\ntry (var conn = pool.acquire();\
          \ var tx = conn.begin()) {\n    ...\n} // порядок закрытия обратный, гарантирован"
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code:
          "// defer сразу после acquire — идиома; забытый defer ловится линтером

          conn, err := pool.Acquire(ctx)

          if err != nil { return err }

          defer conn.Release()"
      - lang: python
        tab: Python
        label: Python
        highlight: python
        code:
          "# context manager; для нескольких ресурсов — ExitStack\nwith pool.acquire() as conn, conn.begin()\
          \ as tx:\n    ..."
