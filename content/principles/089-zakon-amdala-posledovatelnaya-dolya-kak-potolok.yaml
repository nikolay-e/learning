id: 89
slug: zakon-amdala-posledovatelnaya-dolya-kak-potolok
title: 'Закон Амдала: последовательная доля — это потолок'
nav_label: Закон Амдала
section: s7
keywords: amdahl law speedup serial fraction parallel закон амдала ускорение последовательная доля
  gustafson
blocks:
  - type: lede
    html:
      "Ускорение при N исполнителях <code>S(N) = 1 / (s + (1−s)/N)</code>, где s — доля работы, которую
      нельзя выполнить параллельно. При N → ∞ предел равен <code>1/s</code>: 5 % последовательного
      кода означают потолок ×20, сколько ядер, узлов или воркеров ни добавляй."
  - type: text
    html: 'Практическая ценность не в формуле, а в том, что она заставляет назвать s. В сервисах последовательная
      доля почти никогда не выглядит как «однопоточный участок кода»: это единственный писатель, глобальная
      блокировка, автоинкрементный ключ, координация транзакции, лидер в кворуме, общий рейт-лимитер,
      одна партиция, в которую сходится горячий ключ. Пока эта доля не найдена и не измерена, горизонтальное
      масштабирование — покупка ядер под потолок, посчитанный кем-то другим.'
  - type: note
    html: 'Закон посчитан для <strong>фиксированного размера задачи</strong>, и в этом его граница.
      Контрапункт Густафсона: если с ростом ресурсов растёт и объём работы (больше данных, выше разрешение,
      шире окно), доля последовательной части падает, и практический выигрыш ведёт себя лучше, чем
      обещает формула. Оба утверждения верны и отвечают на разные вопросы: «во сколько раз быстрее
      та же задача» и «насколько большую задачу можно взять за то же время». Что закон Амдала не описывает
      вовсе — падение производительности от самого согласования; это добавляет USL (<a href="#p38">38</a>).'
