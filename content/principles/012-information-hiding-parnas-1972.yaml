id: 12
slug: information-hiding-parnas-1972
title: Information Hiding (Parnas, 1972)
nav_label: Information Hiding
section: s2
keywords: information hiding parnas encapsulation module secret
blocks:
  - type: lede
    html: 'Модуль скрывает решение, которое вероятно изменится. Критерий проверяем: «что сломается,
      если это решение пересмотрят». SRP (<a href="#p1">1</a>) — размытый пересказ этого принципа.'
  - type: text
    html: 'Секрет — это конкретное решение: формат хранения, кодировка, порядок полей, алгоритм.
      Интерфейс, отдающий «список ASCII-строк», уже проболтался о кодировке — переход на UTF-8 ломает
      всех потребителей. Тот же интерфейс, описанный как «названия покупок», пережил бы этот переход
      незаметно. Разница не в коде, а в том, что объявлено наружу.'
  - type: note
    html: '<strong>Зачем Java понадобился отдельный этаж видимости.</strong> До модульной системы
      <code>public</code> означало «виден всему classpath»: спрятать решение между пакетами одной
      библиотеки язык не позволял, и вспомогательный класс, сделанный public ради соседнего пакета,
      по закону Хайрама (<a href="#p16">16</a>) становился чужим контрактом. <code>exports</code>
      добавляет второй этаж: public <em>и</em> экспортирован — это API; public в неэкспортированном
      пакете снаружи не существует. Внутри модуля не меняется ничего — пакеты по-прежнему видят
      public-типы друг друга, экспортированные и нет, а <code>private/protected/public</code> работают
      как раньше; модуль лишь фильтрует, что из public-поверхности предъявлено миру. Остальные директивы
      того же файла к hiding отношения не имеют: <code>requires</code> задаёт граф зависимостей,
      <code>opens</code> точечно разрешает рефлексию, <code>uses</code>/<code>provides</code> связывают
      ServiceLoader.'
  - type: code
    panes:
      - lang: java
        tab: Java
        label: Java
        highlight: java
        code:
          "// модульная система (module-info.java) — hiding на уровне артефакта\nmodule billing.core {\n\
          \    requires transitive billing.model;  // видно потребителям: часть API\n    exports com.acme.billing.api;\
          \       // только API\n\n    // com.acme.billing.internal не экспортирован и не открыт:\n    //\
          \ обычный доступ запрещён, deep reflection (setAccessible — исторический\n    // обход любых модификаторов)\
          \ тоже. Доступ всё ещё выдаётся явно —\n    // opens, Module.addOpens(), --add-opens: это граница\
          \ по умолчанию,\n    // а не физическая невозможность.\n}"
      - lang: rust
        tab: Rust
        label: Rust
        highlight: rust
        code: "// pub(crate) / приватность по умолчанию — hiding встроен в язык

          pub struct RateLimiter { /* поля приватны */ }


          pub(crate) mod internal;   // виден внутри крейта, невиден потребителям"
      - lang: go
        tab: Go
        label: Go
        highlight: go
        code: "// пакет internal/ — компилятор запрещает импорт извне поддерева

          // myservice/internal/ratelimit — недоступен из чужих модулей физически"
      - lang: python
        tab: Python
        label: Python
        highlight: python
        code:
          '# конвенция _prefix + __all__; принудительного hiding нет — и это честно

          __all__ = ["RateLimiter"]   # публичный контракт задекларирован явно'
