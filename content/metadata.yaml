# Классификация утверждений. kind/confidence/example_status обязательны для всех принципов —
# validate.py падает, если чего-то нет. caveat заполняется там, где формулировка принципа
# сильнее, чем её область применимости; sources — только проверенные канонические ссылки.
#
# kind:            theorem | model | empirical-law | heuristic | pattern | practice | editorial
#   theorem, model и empirical-law обязаны нести sources — это проверяет validate.py:
#   ярлык «доказано / измерено / подогнано по данным» без первоисточника — просто тон
# confidence:      established | context-dependent | opinionated
# example_status:  fragment | config | pseudocode | none
#   fragment    — реальный синтаксис, но не самостоятельная программа (нужны окружающие типы)
#   config      — декларативная конфигурация, а не код
#   pseudocode  — иллюстрация формы, синтаксис не гарантирован
#   none        — примеров нет
