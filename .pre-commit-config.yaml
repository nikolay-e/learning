repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^assets/.*\.min\.js$'
      - id: end-of-file-fixer
        exclude: '^assets/.*\.min\.js$'
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=256]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # index.html генерируется build.py и проверяется html-validate;
        # прогонять его через prettier нельзя — иначе форматтер и генератор
        # будут по очереди переписывать один файл и сборка перестанет
        # совпадать с содержимым content/
        # content/ тоже мимо: prettier переписывает YAML во flow-стиль, а эти
        # файлы существуют ради человеческого ревью
        exclude: '^(assets/.*\.min\.js|index\.html|package-lock\.json|content/)'
        files: '\.(css|js|md|yaml|yml|html)$'

  # Секреты сканируются по ВСЕМ файлам, включая вендоренные бандлы:
  # exclude выше намеренно локальный, а не глобальный.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: build-is-current
        name: index.html собран из content/
        entry: python3 scripts/validate.py
        language: system
        pass_filenames: false
        files: '^(content/|templates/|scripts/|docs/|README\.md|index\.html)'
