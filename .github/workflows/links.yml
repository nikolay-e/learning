name: links

# Не гейт на PR: протухшая внешняя ссылка не имеет отношения к коммиту, который
# её не трогал. Раз в неделю — и в issue, а не в красный билд.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  external:
    name: sources still resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ссылки в content/metadata.yaml — единственное, что валидатор проверить
      # не может: он видит, что ссылка есть, но не то, что она куда-то ведёт.
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          # Академические хосты отвечают раннеру медленнее, чем человеку: обе
          # ссылки на PDF отдают 200 за полторы секунды с ноутбука и упирались
          # в дефолтные 20 секунд из CI. Таймаут — не гниль ссылки, но и молча
          # исключать хост нельзя: тогда настоящая пропажа пройдёт незамеченной.
          args: >-
            --no-progress
            --max-retries 5
            --timeout 60
            --retry-wait-time 5
            --accept 200..=299,429
            content/metadata.yaml
            README.md
            CONTRIBUTING.md
            THIRD_PARTY.md
          fail: false
      # Отчёт идёт в один issue: create-issue-from-file заводил новый каждую
      # неделю, и очередь росла копиями одного и того же. Ссылки в docs/ сюда
      # не входят намеренно — они ведут на собственную страницу, а их #pNN
      # проверяет validate.py офлайн, на каждом пуше, а не раз в неделю.
      - if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh issue list --label sources --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file ./lychee/out.md
          else
            gh issue create --title "Битые ссылки в источниках" --label sources --body-file ./lychee/out.md
          fi
